map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

map $http_cf_connecting_ip $password_client_key {
  default $http_cf_connecting_ip;
  '' $binary_remote_addr;
}

limit_req_zone $password_client_key zone=password_change:10m rate=6r/m;

server {
  listen 80;
  server_name _;
  absolute_redirect off;

  client_max_body_size 50m;

  location = / {
    add_header Cache-Control "no-store" always;
    return 302 /welcome;
  }

  location = /index.html {
    add_header Cache-Control "no-store" always;
    return 302 /welcome;
  }

  location = /welcome {
    root /usr/share/nginx/html;
    try_files /account-login.html =404;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }

  location = /welcome/ {
    return 302 /welcome;
  }

  location = /register {
    root /usr/share/nginx/html;
    try_files /account-login.html =404;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }

  location = /register/ {
    return 302 /register;
  }

  location = /change-password {
    root /usr/share/nginx/html;
    try_files /change-password.html =404;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }

  location = /change-password/ {
    return 302 /change-password;
  }

  location = /guide {
    root /usr/share/nginx/html;
    try_files /guide.html =404;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  location = /guide/ {
    return 302 /guide;
  }

  location = /api/account/password {
    client_max_body_size 16k;
    limit_req zone=password_change burst=4 nodelay;
    limit_req_status 429;

    proxy_pass http://password-service:3020/change-password;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $password_client_key;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_buffering off;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
  }

  location = /sign-in {
    return 302 /welcome;
  }

  location = /sign-up {
    return 302 /register;
  }

  location / {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    sub_filter_once on;
    sub_filter '</head>' "<style id='crm-guide-entry-style'>#crm-guide-entry{align-items:center;background:#fff;border:1px solid rgba(23,32,51,.14);border-radius:999px;bottom:20px;box-shadow:0 10px 30px rgba(23,32,51,.18);color:#172033;display:flex;font:600 14px/1 Inter,'PingFang SC','Microsoft YaHei',sans-serif;gap:8px;padding:11px 15px;position:fixed;right:20px;text-decoration:none;transition:transform .15s ease,box-shadow .15s ease;z-index:2147483647}#crm-guide-entry:hover{box-shadow:0 14px 36px rgba(23,32,51,.24);transform:translateY(-2px)}#crm-guide-entry .crm-guide-icon{align-items:center;background:#5046e5;border-radius:999px;color:#fff;display:flex;font-size:13px;height:24px;justify-content:center;width:24px}@media(max-width:640px){#crm-guide-entry{bottom:14px;height:46px;padding:0;right:14px;width:46px}#crm-guide-entry .crm-guide-icon{height:28px;margin:auto;width:28px}#crm-guide-entry .crm-guide-text{display:none}}</style></head>";
    sub_filter '</body>' "<a id='crm-guide-entry' href='/guide' target='_blank' rel='noopener' aria-label='打开客户管理系统使用指南'><span class='crm-guide-icon' aria-hidden='true'>?</span><span class='crm-guide-text'>使用指南</span></a></body>";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
