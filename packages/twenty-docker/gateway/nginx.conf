map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

map $http_cf_connecting_ip $password_client_key {
  default $http_cf_connecting_ip;
  '' $binary_remote_addr;
}

limit_req_zone $password_client_key zone=password_change:10m rate=6r/m;

server {
  listen 80;
  server_name _;
  absolute_redirect off;

  client_max_body_size 50m;

  location = / {
    add_header Cache-Control "no-store" always;
    return 302 /welcome;
  }

  location = /index.html {
    add_header Cache-Control "no-store" always;
    return 302 /welcome;
  }

  location = /welcome {
    root /usr/share/nginx/html;
    try_files /account-login.html =404;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }

  location = /welcome/ {
    return 302 /welcome;
  }

  location = /register {
    root /usr/share/nginx/html;
    try_files /account-login.html =404;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }

  location = /register/ {
    return 302 /register;
  }

  location = /change-password {
    root /usr/share/nginx/html;
    try_files /change-password.html =404;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }

  location = /change-password/ {
    return 302 /change-password;
  }

  location = /api/account/password {
    client_max_body_size 16k;
    limit_req zone=password_change burst=4 nodelay;
    limit_req_status 429;

    proxy_pass http://password-service:3020/change-password;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $password_client_key;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_buffering off;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
  }

  location = /sign-in {
    return 302 /welcome;
  }

  location = /sign-up {
    return 302 /register;
  }

  location / {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
