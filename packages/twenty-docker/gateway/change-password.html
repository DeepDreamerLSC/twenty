<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>修改密码 · 客户管理系统</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/integrations/twenty-logo.svg"
    />
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #172033;
        background: #f4f6fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 24px;
        background:
          radial-gradient(circle at 15% 15%, #dce8ff 0, transparent 34%),
          radial-gradient(circle at 85% 80%, #e7ddff 0, transparent 36%),
          #f4f6fb;
      }

      @media (min-height: 820px) {
        body {
          align-items: center;
        }
      }

      main {
        width: min(100%, 420px);
      }

      .card {
        padding: 36px;
        border: 1px solid rgba(23, 32, 51, 0.08);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 24px 70px rgba(43, 54, 86, 0.14);
        backdrop-filter: blur(16px);
      }

      .brand {
        width: 48px;
        height: 48px;
        margin-bottom: 24px;
        overflow: hidden;
        border-radius: 12px;
        box-shadow: 0 6px 18px rgba(23, 32, 51, 0.16);
      }

      .brand img {
        width: 100%;
        height: 100%;
        display: block;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: -0.035em;
      }

      .subtitle {
        margin: 10px 0 24px;
        color: #677085;
        line-height: 1.6;
      }

      label {
        display: block;
        margin: 18px 0 8px;
        font-size: 14px;
        font-weight: 650;
      }

      input {
        width: 100%;
        height: 48px;
        padding: 0 14px;
        border: 1px solid #d9deea;
        border-radius: 11px;
        outline: none;
        background: #fff;
        color: #172033;
        font-size: 16px;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      input:focus {
        border-color: #635bff;
        box-shadow: 0 0 0 4px rgba(99, 91, 255, 0.13);
      }

      .note {
        margin: 5px 0 0;
        color: #778096;
        font-size: 12px;
        line-height: 1.5;
      }

      .primary-button {
        width: 100%;
        height: 48px;
        margin-top: 24px;
        border: 0;
        border-radius: 11px;
        color: #fff;
        background: #5046e5;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .primary-button:hover {
        background: #4338ca;
      }

      .primary-button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .message {
        min-height: 22px;
        margin: 12px 0 0;
        color: #c2413a;
        font-size: 13px;
        text-align: center;
      }

      .message.success {
        color: #15803d;
      }

      .back-link {
        display: block;
        margin-top: 16px;
        color: #5046e5;
        font-size: 14px;
        font-weight: 650;
        text-align: center;
        text-decoration: none;
      }

      .back-link:hover {
        text-decoration: underline;
      }

      @media (max-width: 480px) {
        body {
          padding: 14px;
        }

        .card {
          padding: 28px 22px;
          border-radius: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="page-title">
        <div class="brand" aria-hidden="true">
          <img src="/images/integrations/twenty-logo.svg" alt="" />
        </div>
        <h1 id="page-title">修改密码</h1>
        <p class="subtitle">验证当前密码后设置新密码，成功后需要重新登录。</p>

        <form id="password-form" novalidate>
          <label for="account">账号</label>
          <input
            id="account"
            name="account"
            type="text"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            placeholder="请输入账号"
            required
            autofocus
          />
          <p class="note">支持中文账号、英文账号或原电子邮件账号。</p>

          <label for="current-password">当前密码</label>
          <input
            id="current-password"
            name="current-password"
            type="password"
            autocomplete="current-password"
            placeholder="请输入当前密码"
            required
          />

          <label for="new-password">新密码</label>
          <input
            id="new-password"
            name="new-password"
            type="password"
            autocomplete="new-password"
            placeholder="请输入新密码"
            required
          />
          <p class="note">新密码须为 8–50 位字符。</p>

          <label for="confirm-password">确认新密码</label>
          <input
            id="confirm-password"
            name="confirm-password"
            type="password"
            autocomplete="new-password"
            placeholder="请再次输入新密码"
            required
          />

          <button id="submit-button" class="primary-button" type="submit">
            确认修改密码
          </button>
          <p id="message" class="message" role="alert" aria-live="polite"></p>
        </form>

        <a class="back-link" href="/welcome?switch=1">返回登录</a>
      </section>
    </main>

    <script>
      const TOKEN_PAIR_STORAGE_KEY = 'tokenPairState';
      const form = document.querySelector('#password-form');
      const accountInput = document.querySelector('#account');
      const currentPasswordInput = document.querySelector('#current-password');
      const newPasswordInput = document.querySelector('#new-password');
      const confirmPasswordInput = document.querySelector('#confirm-password');
      const submitButton = document.querySelector('#submit-button');
      const message = document.querySelector('#message');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        message.textContent = '';
        message.classList.remove('success');

        const account = accountInput.value.trim();
        const currentPassword = currentPasswordInput.value;
        const newPassword = newPasswordInput.value;

        try {
          if (!account || !currentPassword || !newPassword) {
            throw new Error('请完整填写账号和密码');
          }

          if (newPassword.length < 8 || newPassword.length > 50) {
            throw new Error('新密码须为 8–50 位字符');
          }

          if (newPassword !== confirmPasswordInput.value) {
            throw new Error('两次输入的新密码不一致');
          }

          if (newPassword === currentPassword) {
            throw new Error('新密码不能与当前密码相同');
          }

          submitButton.disabled = true;
          submitButton.textContent = '正在修改…';

          const response = await fetch('/api/account/password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ account, currentPassword, newPassword }),
          });
          const payload = await response.json().catch(() => ({}));

          if (!response.ok || payload.success !== true) {
            throw new Error(
              response.status === 429
                ? '操作过于频繁，请稍后再试'
                : payload.message || '密码修改失败，请稍后重试',
            );
          }

          localStorage.removeItem(TOKEN_PAIR_STORAGE_KEY);
          message.textContent = payload.message;
          message.classList.add('success');
          form.reset();

          window.setTimeout(() => {
            window.location.replace('/welcome?switch=1&passwordChanged=1');
          }, 1200);
        } catch (error) {
          message.textContent =
            error instanceof Error ? error.message : '密码修改失败，请稍后重试';
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = '确认修改密码';
        }
      });
    </script>
  </body>
</html>
